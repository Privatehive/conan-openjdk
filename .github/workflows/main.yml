name: "Create Conan Package"
on: push

jobs:
  build_linux_x86_64:
    name: "Linux"
    strategy:
      fail-fast: false
      matrix:
        version: [ "21.0.6", "17.0.14", "11.0.26", "8.0.442" ]
    uses: Privatehive/conan-workflows/.github/workflows/createPackage.yml@master
    with:
      name: "x86_64 ${{ matrix.version }}"
      image: "ubuntu-22.04"
      conan_version: ${{ matrix.version }}
      conan_remotes: https://conan.privatehive.de/artifactory/api/conan/public-conan

  build_linux_armv8:
    name: "Linux"
    strategy:
      fail-fast: false
      matrix:
        version: [ "21.0.6", "17.0.14", "11.0.26", "8.0.442" ]
    uses: Privatehive/conan-workflows/.github/workflows/createPackage.yml@master
    with:
      name: "armv8 ${{ matrix.version }}"
      image: "ubuntu-22.04-arm"
      conan_version: ${{ matrix.version }}
      conan_remotes: https://conan.privatehive.de/artifactory/api/conan/public-conan

  build_windows_x86_64:
    name: "Windows"
    strategy:
      fail-fast: false
      matrix:
        version: [ "21.0.6", "17.0.14", "11.0.26", "8.0.442" ]
    uses: Privatehive/conan-workflows/.github/workflows/createPackage.yml@master
    with:
      name: "x86_64 ${{ matrix.version }}"
      image: "windows-2022"
      conan_version: ${{ matrix.version }}
      conan_remotes: https://conan.privatehive.de/artifactory/api/conan/public-conan

  build_macos_x86_64:
    name: "Macos"
    strategy:
      fail-fast: false
      matrix:
        version: [ "21.0.6", "17.0.14", "11.0.26", "8.0.442" ]
    uses: Privatehive/conan-workflows/.github/workflows/createPackage.yml@master
    with:
      name: "x86_64 ${{ matrix.version }}"
      image: "macos-13"
      conan_version: ${{ matrix.version }}
      conan_remotes: https://conan.privatehive.de/artifactory/api/conan/public-conan

  build_macos_armv8:
    name: "Macos"
    strategy:
      fail-fast: false
      matrix:
        version: [ "21.0.6", "17.0.14", "11.0.26", "8.0.442" ]
    uses: Privatehive/conan-workflows/.github/workflows/createPackage.yml@master
    with:
      name: "armv8 ${{ matrix.version }}"
      image: "macos-14"
      conan_version: ${{ matrix.version }}
      conan_remotes: https://conan.privatehive.de/artifactory/api/conan/public-conan

  upload_recipe:
    name: "Finalize"
    uses: Privatehive/conan-workflows/.github/workflows/uploadRecipe.yml@master
    needs: [ build_linux_x86_64, build_linux_armv8, build_windows_x86_64, build_macos_x86_64, build_macos_armv8 ]
    if: ${{ success() }}
    secrets: inherit
    with:
      publish_property: ${{ github.ref == 'refs/heads/master' }}
      conan_upload_remote: https://conan.privatehive.de/artifactory/api/conan/public-conan
      conan_versions: "21.0.6,17.0.14,11.0.26,8.0.442"
      conan_primary_version: "21.0.6"
